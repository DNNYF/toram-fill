<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toram Online Statting Optimizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
            height: calc(100vh - 200px);
        }

        .input-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-y: auto;
        }

        .output-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-y: auto;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .stat-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-input select {
            flex: 1;
        }

        .stat-input input {
            width: 80px;
            text-align: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .success-rate {
            font-size: 1.5em;
            font-weight: bold;
            color: #38a169;
        }

        .formula-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .formula-table th,
        .formula-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .formula-table th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
        }

        .formula-table tbody tr:hover {
            background: #f7fafc;
        }

        .material-summary {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .material-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .material-item {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .material-item .amount {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .material-item .type {
            font-size: 0.9em;
            color: #718096;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        .add-stat-btn {
            width: 100%;
            padding: 8px;
            border: 2px dashed #cbd5e0;
            background: none;
            border-radius: 6px;
            color: #718096;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-stat-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .remove-stat-btn {
            background: #fed7d7;
            color: #c53030;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Toram Online Statting Optimizer</h1>
            <p>Automatically generate optimal statting formulas with maximum efficiency</p>
        </div>

        <div class="main-content">
            <!-- Left Panel: Input Form -->
            <div class="input-panel">
                <div class="section">
                    <h3>Equipment Configuration</h3>
                    <div class="form-group">
                        <label for="equipment-type">Equipment Type</label>
                        <select id="equipment-type">
                            <option value="w">Weapon</option>
                            <option value="a">Armor</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="base-potential">Base Potential</label>
                        <input type="number" id="base-potential" value="89" min="1" max="999">
                    </div>
                    <div class="form-group">
                        <label for="recipe-potential">Recipe Potential</label>
                        <input type="number" id="recipe-potential" value="46" min="0" max="999">
                    </div>
                </div>

                <div class="section">
                    <h3>Advanced Settings</h3>
                    <div class="form-group">
                        <label for="tec-stat">TEC Stat</label>
                        <input type="number" id="tec-stat" value="255" min="0" max="255">
                    </div>
                    <div class="form-group">
                        <label for="proficiency">Proficiency Level</label>
                        <input type="number" id="proficiency" value="0" min="0" max="999">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="mat-reduction" checked> Material Reduction Passive (10%)
                        </label>
                    </div>
                </div>

                <div class="section">
                    <h3>Desired Stats</h3>
                    <div id="stats-container">
                        <!-- Dynamic stats will be added here -->
                    </div>
                    <button class="add-stat-btn" onclick="addStatInput()">+ Add Stat</button>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="generateFormula()">Generate Formula</button>
                    <button class="btn btn-secondary" onclick="resetForm()">Reset</button>
                </div>
            </div>

            <!-- Right Panel: Output Results -->
            <div class="output-panel">
                <div id="results-content">
                    <div class="loading">
                        <h3>Ready to Generate Formula</h3>
                        <p>Configure your equipment and desired stats, then click "Generate Formula" to see optimal statting steps.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Include existing JS libraries -->
    <script src="js/math.js"></script>
    <script src="js/formulas.js"></script>
    
    <script>
        // New statting optimizer implementation
        let statCount = 0;
        let currentFormula = null;

        // Stat options for the new interface
        const STAT_OPTIONS = [
            { "name": "STR", "mat": "Beast", "pot": 5, "cost": 25, "cat": "Enhance Stats", "type": "u", bonus: 1},
            { "name": "STR %", "mat": "Beast", "pot": 10, "cost": 50, "cat": "Enhance Stats", "type": "u" },
            { "name": "INT", "mat": "Wood", "pot": 5, "cost": 25, "cat": "Enhance Stats", "type": "u", bonus: 1},
            { "name": "INT %", "mat": "Wood", "pot": 10, "cost": 50, "cat": "Enhance Stats", "type": "u" },
            { "name": "VIT", "mat": "Metal", "pot": 5, "cost": 25, "cat": "Enhance Stats", "type": "u" , bonus: 1},
            { "name": "VIT %", "mat": "Metal", "pot": 10, "cost": 50, "cat": "Enhance Stats", "type": "u" },
            { "name": "AGI", "mat": "Cloth", "pot": 5, "cost": 25, "cat": "Enhance Stats", "type": "u", bonus: 1 },
            { "name": "AGI %", "mat": "Cloth", "pot": 10, "cost": 50, "cat": "Enhance Stats", "type": "u" },
            { "name": "DEX", "mat": "Medicine", "pot": 5, "cost": 25, "cat": "Enhance Stats", "type": "u", bonus: 1},
            { "name": "DEX %", "mat": "Medicine", "pot": 10, "cost": 50, "cat": "Enhance Stats", "type": "u" },
            { "name": "ATK", "mat": "Beast", "pot": 3, "cost": "16.49", "cat": "Enhance Attack", "type": "w", bonus: 1 },
            { "name": "ATK %", "mat": "Beast", "pot": 10, "cost": 50, "cat": "Enhance Attack", "type": "w", bonus: 1, bonusratio: 0.5 },
            { "name": "MATK", "mat": "Wood", "pot": 3, "cost": "16.49", "cat": "Enhance Attack", "type": "w", bonus: 1 },
            { "name": "MATK %", "mat": "Wood", "pot": 10, "cost": 50, "cat": "Enhance Attack", "type": "w", bonus: 1, bonusratio: 0.5 },
            { "name": "Critical Rate", "mat": "Mana", "pot": 1, "cost": 5, "cat": "Enhance Critical", "type": "u", bonus: 1, max_only: true },
            { "name": "Critical Rate %", "mat": "Mana", "pot": 1, "cost": 5, "cat": "Enhance Critical", "type": "u", bonus: 1, max_only: true },
            { "name": "Critical Damage", "mat": "Mana", "pot": 3, "cost": "16.49", "cat": "Enhance Critical", "type": "u", bonus: 1, bonusratio: 1 / 3 },
            { "name": "Critical Damage %", "mat": "Mana", "pot": 10, "cost": 50, "cat": "Enhance Critical", "type": "u", bonus: 1, bonusratio: 1 / 8 },
            { "name": "MaxHP", "mat": "Metal", "pot": 3, "cost": "16.49", "cat": "Enhance HP/MP", "type": "u", bonus: 160, step: 10 },
            { "name": "MaxHP %", "mat": "Metal", "pot": 10, "cost": 50, "cat": "Enhance HP/MP", "type": "u", bonus: 1, bonusratio: 1 / 3},
            { "name": "DEF", "mat": "Metal", "pot": 3, "cost": "16.49", "cat": "Enhance Defense", "type": "a", bonus: 10 },
            { "name": "DEF %", "mat": "Metal", "pot": 10, "cost": 50, "cat": "Enhance Defense", "type": "a", bonus: 1, bonusratio: 1 / 3 },
            { "name": "MDEF", "mat": "Metal", "pot": 3, "cost": "16.49", "cat": "Enhance Defense", "type": "a", bonus: 10 },
            { "name": "MDEF %", "mat": "Metal", "pot": 10, "cost": 50, "cat": "Enhance Defense", "type": "a", bonus: 1, bonusratio: 1 / 3 },
            { "name": "Accuracy", "mat": "Medicine", "pot": 10, "cost": 50, "cat": "Enhance Accuracy", "type": "w", bonus: 2, bonusratio: 2 / 3 },
            { "name": "Dodge", "mat": "Cloth", "pot": 10, "cost": 50, "cat": "Enhance Dodge", "type": "a", bonus: 2, bonusratio: 2 / 3 },
            { "name": "ASPD", "mat": "Cloth", "pot": 1, "cost": "1.49", "cat": "Enhance Speed", "type": "u", bonus: 16 },
            { "name": "CSPD", "mat": "Medicine", "pot": 1, "cost": "1.49", "cat": "Enhance Speed", "type": "u", bonus: 16 },
        ];

        function createStatDropdown() {
            let options = '<option value="">Choose Stat</option>';
            let currentCategory = '';
            
            for (let stat of STAT_OPTIONS) {
                if (stat.cat !== currentCategory) {
                    if (currentCategory) options += '</optgroup>';
                    options += `<optgroup label="${stat.cat}">`;
                    currentCategory = stat.cat;
                }
                options += `<option value="${stat.name}">${stat.name}</option>`;
            }
            if (currentCategory) options += '</optgroup>';
            
            return options;
        }

        function addStatInput() {
            statCount++;
            const container = document.getElementById('stats-container');
            const statDiv = document.createElement('div');
            statDiv.className = 'stats-grid';
            statDiv.id = `stat-${statCount}`;
            
            statDiv.innerHTML = `
                <div class="stat-input">
                    <select onchange="updateStatInput(${statCount})">
                        ${createStatDropdown()}
                    </select>
                    <input type="number" value="0" min="-20" max="20" onchange="updateFormula()">
                </div>
                <button class="remove-stat-btn" onclick="removeStat(${statCount})">Remove</button>
            `;
            
            container.appendChild(statDiv);
            updateFormula();
        }

        function removeStat(id) {
            const statDiv = document.getElementById(`stat-${id}`);
            if (statDiv) {
                statDiv.remove();
                updateFormula();
            }
        }

        function updateStatInput(id) {
            updateFormula();
        }

        function resetForm() {
            document.getElementById('stats-container').innerHTML = '';
            statCount = 0;
            document.getElementById('results-content').innerHTML = `
                <div class="loading">
                    <h3>Ready to Generate Formula</h3>
                    <p>Configure your equipment and desired stats, then click "Generate Formula" to see optimal statting steps.</p>
                </div>
            `;
            // Add default stats
            addStatInput();
            addStatInput();
        }

        function collectUserInput() {
            const equipType = document.getElementById('equipment-type').value;
            const basePot = parseInt(document.getElementById('base-potential').value);
            const recipePot = parseInt(document.getElementById('recipe-potential').value);
            const tec = parseInt(document.getElementById('tec-stat').value);
            const proficiency = parseInt(document.getElementById('proficiency').value);
            const matReduction = document.getElementById('mat-reduction').checked;

            const stats = [];
            const statInputs = document.querySelectorAll('#stats-container .stats-grid');
            
            statInputs.forEach(statDiv => {
                const select = statDiv.querySelector('select');
                const input = statDiv.querySelector('input');
                const statName = select.value;
                const value = parseInt(input.value);
                
                if (statName && value !== 0) {
                    const statData = STAT_OPTIONS.find(s => s.name === statName);
                    if (statData) {
                        stats.push({
                            name: statName,
                            value: value,
                            data: statData
                        });
                    }
                }
            });

            return {
                equipType,
                basePot,
                recipePot,
                tec,
                proficiency,
                matReduction,
                stats
            };
        }

        function generateFormula() {
            const input = collectUserInput();
            
            if (input.stats.length === 0) {
                showError('Please add at least one stat with a non-zero value.');
                return;
            }

            try {
                const optimizer = new StattingOptimizer(input);
                optimizer.validateConfiguration();
                currentFormula = optimizer.generateOptimalFormula();
                
                // Show optimization suggestions if any
                const suggestions = optimizer.getOptimizationSuggestions();
                if (suggestions.length > 0) {
                    console.log('Optimization suggestions:', suggestions);
                }
                
                displayResults(currentFormula);
            } catch (error) {
                showError('Error generating formula: ' + error.message);
            }
        }

        function updateFormula() {
            // Auto-update when values change - debounced
            clearTimeout(window.updateTimer);
            window.updateTimer = setTimeout(() => {
                const input = collectUserInput();
                if (input.stats.length > 0) {
                    try {
                        const optimizer = new StattingOptimizer(input);
                        currentFormula = optimizer.generateOptimalFormula();
                        displayResults(currentFormula);
                    } catch (error) {
                        // Silently ignore errors during auto-update
                    }
                }
            }, 500);
        }

        function showError(message) {
            document.getElementById('results-content').innerHTML = `
                <div class="error-message">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }

        function displayResults(formula) {
            if (!formula) return;

            let html = `
                <div class="results-header">
                    <h3>Optimal Statting Formula</h3>
                    <div class="success-rate">${formula.successRate.toFixed(1)}%</div>
                </div>
                
                <table class="formula-table">
                    <thead>
                        <tr>
                            <th>Step</th>
                            <th>Action</th>
                            <th>Potential</th>
                            <th>Materials</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            formula.steps.forEach((step, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${step.description}</td>
                        <td>${step.potentialAfter}</td>
                        <td>${step.materials}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                
                <div class="material-summary">
                    <h4>Total Material Cost</h4>
                    <div class="material-grid">
            `;

            for (let [material, amount] of Object.entries(formula.totalMaterials)) {
                if (amount > 0) {
                    html += `
                        <div class="material-item">
                            <div class="amount">${amount}</div>
                            <div class="type">${material}</div>
                        </div>
                    `;
                }
            }

            html += `
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="exportFormula()">Export Formula</button>
                    <button class="btn btn-secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
                </div>
            `;

            document.getElementById('results-content').innerHTML = html;
        }

        function exportFormula() {
            if (!currentFormula) return;
            
            let text = "Toram Online Statting Formula\n";
            text += "================================\n";
            text += `Equipment: ${currentFormula.equipType === 'w' ? 'Weapon' : 'Armor'}\n`;
            text += `Base Potential: ${currentFormula.basePotential}\n`;
            text += `Success Rate: ${currentFormula.successRate.toFixed(1)}%\n\n`;
            
            text += "Steps:\n";
            currentFormula.steps.forEach((step, index) => {
                text += `${index + 1}. ${step.description} (${step.potentialAfter} potential)\n`;
            });
            
            text += "\nMaterial Costs:\n";
            for (let [material, amount] of Object.entries(currentFormula.totalMaterials)) {
                if (amount > 0) {
                    text += `${material}: ${amount}\n`;
                }
            }
            
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'toram_statting_formula.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyToClipboard() {
            if (!currentFormula) return;
            
            let text = `Toram Statting Formula - ${currentFormula.successRate.toFixed(1)}% Success\n`;
            currentFormula.steps.forEach((step, index) => {
                text += `${index + 1}. ${step.description}\n`;
            });
            
            navigator.clipboard.writeText(text).then(() => {
                alert('Formula copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy formula. Please try again.');
            });
        }

        // Initialize with default stats
        document.addEventListener('DOMContentLoaded', () => {
            addStatInput();
            addStatInput();
        });
    </script>

    <!-- Statting Optimizer Class - Core Logic -->
    <script>
        class StattingOptimizer {
            constructor(config) {
                this.equipType = config.equipType;
                this.basePotential = config.basePot;
                this.recipePotential = config.recipePot;
                this.tec = config.tec || 255;
                this.proficiency = config.proficiency || 0;
                this.matReduction = config.matReduction || false;
                this.stats = config.stats;
                
                this.potentialReturn = 5 + this.tec / 10;
                this.bonusPotentialReturn = this.potentialReturn / 4;
            }

            generateOptimalFormula() {
                // Simulate the statting process using existing logic
                const steps = [];
                let currentPotential = this.basePotential;
                const materials = { Metal: 0, Cloth: 0, Beast: 0, Wood: 0, Medicine: 0, Mana: 0 };
                
                // Sort stats by priority (highest potential cost first for negatives, then positives)
                const negativeStats = this.stats.filter(s => s.value < 0).sort((a, b) => 
                    Math.abs(b.value) * b.data.pot - Math.abs(a.value) * a.data.pot
                );
                const positiveStats = this.stats.filter(s => s.value > 0).sort((a, b) => 
                    b.value * b.data.pot - a.value * a.data.pot
                );

                // Process negative stats first (they give potential back)
                negativeStats.forEach(stat => {
                    const potentialGain = this.calculatePotentialChange(stat, true);
                    const materialCost = this.calculateMaterialCost(stat);
                    
                    currentPotential += Math.abs(potentialGain);
                    materials[stat.data.mat] += materialCost;
                    
                    steps.push({
                        description: this.formatStatChange(stat),
                        potentialAfter: currentPotential,
                        materials: `${materialCost} ${stat.data.mat}`
                    });
                });

                // Process positive stats
                positiveStats.forEach(stat => {
                    const potentialCost = this.calculatePotentialChange(stat, false);
                    const materialCost = this.calculateMaterialCost(stat);
                    
                    currentPotential -= potentialCost;
                    materials[stat.data.mat] += materialCost;
                    
                    steps.push({
                        description: this.formatStatChange(stat),
                        potentialAfter: currentPotential,
                        materials: `${materialCost} ${stat.data.mat}`
                    });
                });

                // Calculate success rate
                const successRate = this.calculateSuccessRate(currentPotential);

                return {
                    equipType: this.equipType,
                    basePotential: this.basePotential,
                    finalPotential: currentPotential,
                    successRate: successRate,
                    steps: steps,
                    totalMaterials: materials
                };
            }

            calculatePotentialChange(stat, isNegative) {
                let basePotential = Math.abs(stat.value) * stat.data.pot;
                
                // Apply equipment type modifier
                if (stat.data.type !== this.equipType && ['a', 'w'].includes(stat.data.type)) {
                    basePotential *= 2;
                }
                
                // Apply penalty for multiple stats in same category
                const penalty = this.calculatePenalty();
                basePotential *= penalty;
                
                // Apply negative stat return rate
                if (isNegative) {
                    basePotential *= (this.potentialReturn / 100);
                }
                
                return Math.floor(basePotential);
            }

            calculateMaterialCost(stat) {
                let totalCost = 0;
                const steps = Math.abs(stat.value);
                
                for (let i = 1; i <= steps; i++) {
                    totalCost += stat.data.cost * Math.pow(i, 2);
                }
                
                // Apply cost reduction
                let reduction = 100 - (Math.floor(this.proficiency / 10) + Math.floor(this.proficiency / 50));
                if (this.matReduction) reduction *= 0.9;
                totalCost *= (reduction / 100);
                
                return Math.floor(totalCost);
            }

            calculatePenalty() {
                const categories = {};
                this.stats.forEach(stat => {
                    if (!categories[stat.data.cat]) categories[stat.data.cat] = 0;
                    categories[stat.data.cat]++;
                });
                
                let penalty = 0;
                Object.values(categories).forEach(count => {
                    if (count >= 2) {
                        // Simplified penalty calculation
                        penalty += (count - 1) * 0.2;
                    }
                });
                
                return 1 + penalty;
            }

            calculateSuccessRate(finalPotential) {
                const prevPot = this.basePotential > this.recipePotential ? this.basePotential : this.recipePotential;
                let successRate = 160 + (finalPotential * 230) / prevPot;
                
                if (successRate > 100) successRate = 100;
                if (successRate < 0) successRate = 0;
                
                return successRate;
            }

            formatStatChange(stat) {
                const sign = stat.value > 0 ? '+' : '';
                return `${stat.name} ${sign}${stat.value}`;
            }
        }
    </script>
