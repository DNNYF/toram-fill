<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanaka0-Style Toram Statting Calculator</title>
    <script src="js/tanaka_stats.js"></script>
    <script src="js/tanaka_engine.js"></script>
    <style>
        body {
            font-family: Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .header {
            text-align: center;
            color: #2c5aa0;
            margin-bottom: 20px;
        }
        
        .author {
            text-align: right;
            font-size: 8pt;
            color: #666;
            margin-bottom: 10px;
        }
        
        .config-panel {
            background: white;
            border: 2px solid #2c5aa0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .config-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .config-item label {
            font-weight: bold;
            color: #2c5aa0;
        }
        
        .config-item input, .config-item select {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border: 2px solid #2c5aa0;
            border-radius: 8px;
            padding: 15px;
        }
        
        .stat-card h3 {
            margin: 0 0 15px 0;
            color: #2c5aa0;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        
        .stat-slot {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 5px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        
        .stat-slot select {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .stat-slot input {
            width: 60px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        
        .stat-info {
            font-size: 10px;
            color: #666;
            min-width: 120px;
        }
        
        .results-container {
            background: white;
            border: 2px solid #2c5aa0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .results-header h3 {
            margin: 0;
            color: #2c5aa0;
        }
        
        .generate-btn {
            background: #2c5aa0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .generate-btn:hover {
            background: #1e3f73;
        }
        
        .formula-steps {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .step {
            display: grid;
            grid-template-columns: 50px 2fr 1fr 1fr 1fr;
            gap: 10px;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #f9f9f9;
            border-radius: 4px;
            align-items: center;
            font-size: 12px;
        }
        
        .step-header {
            display: grid;
            grid-template-columns: 50px 2fr 1fr 1fr 1fr;
            gap: 10px;
            padding: 8px;
            margin-bottom: 10px;
            background-color: #2c5aa0;
            color: white;
            border-radius: 4px;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
        }
        
        .step-number {
            text-align: center;
            font-weight: bold;
            color: #2c5aa0;
        }
        
        .success-rate {
            text-align: center;
        }
        
        .remaining-pot {
            text-align: center;
        }
        
        .materials {
            font-size: 10px;
            color: #666;
        }
        
        .error {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        .success {
            color: #2e7d32;
            background-color: #e8f5e8;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        .material-summary {
            background-color: #f0f7ff;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
        }
        
        .material-summary h4 {
            margin: 0 0 10px 0;
            color: #2c5aa0;
        }
        
        .material-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 12px;
        }
        
        .material-item {
            background: white;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="author">Enhanced by AI for Tanaka0-style optimal formula generation</div>
    <div class="header">
        <h1>Tanaka0-Style Toram Statting Calculator</h1>
        <p>Optimal formula generation with direct stat application and Toram rules enforcement</p>
    </div>

    <div class="config-panel">
        <div class="config-item">
            <label for="equipment-type">Equipment:</label>
            <select id="equipment-type" onchange="updateEquipmentType()">
                <option value="w">Weapon</option>
                <option value="a">Armor</option>
            </select>
        </div>
        <div class="config-item">
            <label for="starting-pot">Starting Potential:</label>
            <input type="number" id="starting-pot" value="89" min="1" max="999" onchange="recalculateFormula()">
        </div>
        <div class="config-item">
            <label for="recipe-pot">Recipe Potential:</label>
            <input type="number" id="recipe-pot" value="46" min="0" max="100" onchange="recalculateFormula()">
        </div>
    </div>

    <div class="main-container">
        <div class="stat-card">
            <h3>Stat Slots 1-8</h3>
            <div id="stat-slots-1"></div>
        </div>
        <div class="stat-card">
            <h3>Stat Slots 9-16</h3>
            <div id="stat-slots-2"></div>
        </div>
    </div>

    <div class="results-container">
        <div class="results-header">
            <h3>Optimal Formula</h3>
            <button class="generate-btn" onclick="recalculateFormula()">Generate Formula</button>
        </div>
        <div id="formula-result"></div>
    </div>

    <script>
        // Global state
        let statSlots = Array(16).fill(null).map(() => ({ name: '', value: 0, statData: null }));
        let currentEquipmentType = 'w';

        // Initialize the interface
        function initializeInterface() {
            createStatSlots();
            recalculateFormula();
        }

        function createStatSlots() {
            const container1 = document.getElementById('stat-slots-1');
            const container2 = document.getElementById('stat-slots-2');
            
            // Clear existing content
            container1.innerHTML = '';
            container2.innerHTML = '';
            
            // Create slots 1-8
            for (let i = 0; i < 8; i++) {
                container1.appendChild(createStatSlot(i));
            }
            
            // Create slots 9-16  
            for (let i = 8; i < 16; i++) {
                container2.appendChild(createStatSlot(i));
            }
        }

        function createStatSlot(index) {
            const slotDiv = document.createElement('div');
            slotDiv.className = 'stat-slot';
            
            const select = document.createElement('select');
            select.id = `stat-select-${index}`;
            select.onchange = () => updateStatSlot(index);
            
            // Add default option
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = 'Choose Stat';
            select.appendChild(defaultOption);
            
            // Group stats by category
            const categories = {};
            TANAKA_STATS.forEach(stat => {
                if (!categories[stat.cat]) {
                    categories[stat.cat] = [];
                }
                categories[stat.cat].push(stat);
            });
            
            // Add options grouped by category
            Object.keys(categories).forEach(category => {
                if (category === 'Awaken Elements' && currentEquipmentType === 'a') {
                    return; // Skip awaken elements for armor
                }
                
                const optgroup = document.createElement('optgroup');
                optgroup.label = category;
                
                categories[category].forEach(stat => {
                    const option = document.createElement('option');
                    option.value = stat.name;
                    option.textContent = stat.name;
                    optgroup.appendChild(option);
                });
                
                select.appendChild(optgroup);
            });
            
            const input = document.createElement('input');
            input.type = 'number';
            input.id = `stat-value-${index}`;
            input.value = 0;
            input.disabled = true;
            input.onchange = () => updateStatValue(index);
            
            const infoDiv = document.createElement('div');
            infoDiv.className = 'stat-info';
            infoDiv.id = `stat-info-${index}`;
            infoDiv.textContent = 'MAX: - | POT: -';
            
            slotDiv.appendChild(select);
            slotDiv.appendChild(input);
            slotDiv.appendChild(infoDiv);
            
            return slotDiv;
        }

        function updateStatSlot(index) {
            const select = document.getElementById(`stat-select-${index}`);
            const input = document.getElementById(`stat-value-${index}`);
            const info = document.getElementById(`stat-info-${index}`);
            
            const statName = select.value;
            
            if (statName) {
                const statData = getStatByName(statName);
                if (statData) {
                    statSlots[index] = {
                        name: statName,
                        value: 0,
                        statData: statData
                    };
                    
                    input.disabled = false;
                    input.min = statData.no_negative ? 0 : -statData.max;
                    input.max = statData.max;
                    input.value = 0;
                    
                    info.textContent = `MAX: ${statData.max} | POT: ${statData.pot}`;
                } else {
                    input.disabled = true;
                    info.textContent = 'MAX: - | POT: -';
                }
            } else {
                statSlots[index] = { name: '', value: 0, statData: null };
                input.disabled = true;
                input.value = 0;
                info.textContent = 'MAX: - | POT: -';
            }
            
            recalculateFormula();
        }

        function updateStatValue(index) {
            const input = document.getElementById(`stat-value-${index}`);
            const value = parseInt(input.value) || 0;
            
            if (statSlots[index].statData) {
                statSlots[index].value = value;
                recalculateFormula();
            }
        }

        function updateEquipmentType() {
            const select = document.getElementById('equipment-type');
            currentEquipmentType = select.value;
            
            // Update recipe potential default
            const recipePot = document.getElementById('recipe-pot');
            if (currentEquipmentType === 'w') {
                recipePot.value = 46;
            } else {
                recipePot.value = 44;
            }
            
            // Recreate stat slots to handle awaken elements visibility
            createStatSlots();
            recalculateFormula();
        }

        function recalculateFormula() {
            const startingPot = parseInt(document.getElementById('starting-pot').value) || 89;
            const recipePot = parseInt(document.getElementById('recipe-pot').value) || 0;
            const totalPot = startingPot + recipePot;
            
            // Filter out empty stats
            const activeStats = statSlots.filter(slot => slot.name && slot.value !== 0);
            
            if (activeStats.length === 0) {
                displayResult({ success: false, error: "No stats selected" });
                return;
            }
            
            // Generate formula
            const result = tanakaGenerator.generateOptimalFormula(totalPot, activeStats, currentEquipmentType);
            displayResult(result);
        }

        function displayResult(result) {
            const container = document.getElementById('formula-result');
            
            if (!result.success) {
                container.innerHTML = `<div class="error">Error: ${result.error}</div>`;
                return;
            }
            
            if (!result.steps || result.steps.length === 0) {
                container.innerHTML = `<div class="error">No steps generated</div>`;
                return;
            }
            
            let html = '<div class="step-header">';
            html += '<div>Step</div>';
            html += '<div>Change</div>';
            html += '<div>Remaining Pot</div>';
            html += '<div>Success Rate</div>';
            html += '<div>Materials</div>';
            html += '</div>';
            
            html += '<div class="formula-steps">';
            
            result.steps.forEach(step => {
                html += '<div class="step">';
                html += `<div class="step-number">${step.step}</div>`;
                html += `<div>${step.change}</div>`;
                html += `<div class="remaining-pot">${step.remaining_pot}</div>`;
                html += `<div class="success-rate">${step.success_rate}%</div>`;
                html += `<div class="materials">${step.materials}</div>`;
                html += '</div>';
            });
            
            html += '</div>';
            
            // Add material summary
            html += '<div class="material-summary">';
            html += '<h4>Total Materials Required</h4>';
            html += '<div class="material-grid">';
            Object.entries(result.totalMaterials).forEach(([material, amount]) => {
                if (amount > 0) {
                    html += `<div class="material-item"><strong>${material}:</strong> ${amount}</div>`;
                }
            });
            html += '</div>';
            html += '</div>';
            
            html += `<div class="success">Formula generated successfully! Final potential: ${result.finalPotential}</div>`;
            
            container.innerHTML = html;
        }

        // Initialize when page loads
        window.onload = initializeInterface;
    </script>
</body>
</html>
